[project]
name = "banglabot-speech"
version = "0.1.0"
description = "Local open-source speech server (Parakeet STT + Silero VAD + Kokoro TTS) for BanglaBot phone-call testing."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=2.0",
    "onnx-asr[hub]==0.12.0",
    "kokoro-onnx==0.6.1",
    "huggingface-hub>=0.30",
    "httpx>=0.27",
    "websockets>=13",
    # GPU build on Linux x86_64 (CUDA 13 + cuDNN 9 come as pip wheels; CPU EP still works without a GPU).
    "onnxruntime-gpu[cuda,cudnn]==1.31.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "onnxruntime==1.31.0; sys_platform != 'linux' or platform_machine != 'x86_64'",
]

[tool.uv]
package = false
# kokoro-onnx hard-depends on the CPU `onnxruntime` wheel, which would clobber
# `onnxruntime-gpu` (same import name). Only allow it where the GPU wheel is not used.
override-dependencies = [
    "onnxruntime==1.31.0; sys_platform != 'linux' or platform_machine != 'x86_64'",
]
