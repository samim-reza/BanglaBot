services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sloancodeai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sloancodeai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Copy .env.example to .env and fill in the secrets (OpenAI, Twilio, ...).
    env_file:
      - .env
    environment:
      # Inside the compose network the databases are reached by service name,
      # overriding the localhost defaults from .env.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/sloancodeai
      REDIS_URL: redis://redis:6379/0
      TTS_CACHE_DIR: /app/.tts-cache
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - tts_cache:/app/.tts-cache

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_BACKEND_URL: http://backend:8000
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NEXT_BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  tts_cache:
