# Render Blueprint: the backend (FastAPI voice + chat agent) as one free Docker web service.
# The frontend is deployed separately (Vercel); the database is Supabase.
# Secrets (sync: false) are entered in the Render dashboard, never committed.
services:
  - type: web
    # Service name kept from before the Callisa rename: it is the live banglabot-api.onrender.com host.
    name: banglabot-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: APP_NAME
        value: Callisa
      - key: TTS_CACHE_DIR
        value: /app/.tts-cache
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_VERIFY
        value: "false"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      # Telnyx: calls + SMS. The API key is a secret; the rest identify the portal setup.
      - key: TELNYX_API_KEY
        sync: false
      - key: TELNYX_TEXML_APP_ID
        value: "3062706520463508771"
      - key: TELNYX_FROM_NUMBER
        value: "+18723428160"
      - key: TELNYX_MESSAGING_PROFILE_ID
        value: 4001a102-da15-41e1-9fc0-62171ef56b94
      - key: TELNYX_ACCOUNT_SID
        sync: false
      # New Telnyx accounts allow 2 concurrent outbound calls.
      - key: BULK_CALL_MAX_CONCURRENT
        value: "2"
      # Security (the app refuses to boot in production with defaults or short values).
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TOKEN_SECRET
        sync: false
      - key: ENCRYPTION_SECRET
        sync: false
      - key: TELNYX_WEBHOOK_SECRET
        sync: false
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # Voice engine: free provider keys + chains (no local speech server on Render).
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AZURE_SPEECH_KEY
        sync: false
      - key: AZURE_SPEECH_REGION
        value: southeastasia
      - key: LLM_ALLOW_PAID
        value: "false"
      - key: STT_CHAIN
        value: deepgram,groq,openai
      - key: TTS_CHAIN
        value: deepgram,gemini,edge,azure
      # Shared audio cache (Supabase Storage bucket) — survives redeploys.
      - key: SUPABASE_URL
        value: https://loxiscjleuogleqhgdap.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      # Payments: dummy test page until Stripe keys are set.
      - key: PAYMENT_PROVIDER
        value: dummy
