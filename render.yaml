# Render Blueprint: the backend (FastAPI voice + chat agent) as one free Docker web service.
# The frontend is deployed separately (Vercel); the database is Supabase.
# Secrets (sync: false) are entered in the Render dashboard, never committed.
services:
  - type: web
    name: banglabot-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: APP_NAME
        value: BanglaBot
      - key: TTS_CACHE_DIR
        value: /app/.tts-cache
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_VERIFY
        value: "false"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
