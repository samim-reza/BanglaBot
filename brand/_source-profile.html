<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:transparent}
  body{width:1000px;height:1000px;overflow:hidden}
</style>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#14b8a6"/>
      <stop offset="45%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0b4f4a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.22" r="0.75">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="1000" fill="url(#bg)"/>
  <rect width="1000" height="1000" fill="url(#glow)"/>

  <!-- soft depth ring, stays inside the circular crop -->
  <circle cx="500" cy="500" r="430" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>

  <g transform="translate(-72,0)">
    <!-- Bengali 'ba' mark -->
    <text x="452" y="500" fill="#ffffff" stroke="#ffffff" stroke-width="16"
          stroke-linejoin="round" paint-order="stroke"
          font-family="'Lohit Bengali','Mukti','Likhan',sans-serif"
          font-size="470" text-anchor="middle" dominant-baseline="central">ব</text>

    <!-- outgoing call / voice waves -->
    <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-width="30">
      <path d="M 672 430 A 92 92 0 0 1 672 570"  stroke-opacity="0.95"/>
      <path d="M 736 390 A 156 156 0 0 1 736 610" stroke-opacity="0.60"/>
      <path d="M 800 350 A 220 220 0 0 1 800 650" stroke-opacity="0.30"/>
    </g>
  </g>
</svg>
